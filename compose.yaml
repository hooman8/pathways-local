name: pathways-local

services:
  app:
    build: .
    image: pathways-local:latest
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PATHWAYS_PORT:-8080}:8080"
    environment:
      APP_BASE_URL: "http://localhost:${PATHWAYS_PORT:-8080}"
      PATHWAYS_DB_PATH: /data/pathways.sqlite
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - pathways-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  pathways-data:
